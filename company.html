<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="company-handle" content="{{HANDLE}}">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{CANONICAL}}">{{ROBOTS}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="Circuits.com">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:image" content="{{OGIMAGE}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESC}}">
<meta name="twitter:image" content="{{OGIMAGE}}">
<link rel="icon" href="/assets/favicon.png">
<link rel="stylesheet" href="/styles.css">
<script src="/nav.js"></script>
<script async src="/analytics.js"></script>
</head>
<body>

<header class="topbar">
  <div class="inner">
    <div class="brand"><a href="/"><img class="logo-nav" src="/assets/logo-bar.png" alt="Circuits.com"></a><span class="brand-slogan">Connecting The Circuits Industry</span></div>
    <nav class="nav">
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
      <a class="nav-auth nav-signin" href="/portal">Sign In</a>
      <a class="nav-auth nav-dash" href="/portal">Dashboard</a>
      <a class="cta" href="/join">Get Listed</a>
    </nav>
      <!-- The bell ships in the markup and starts hidden; nav.js shows it in
           <head> when somebody is signed in, and app.js only fills it in. It
           used to be built and inserted at DOMContentLoaded, after an async
           currentUser() call, so it landed well after first paint and shoved
           the whole header sideways on every load (Jacob, 2026-09-03). -->
      <button type="button" class="inbox-btn" aria-label="Notifications" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="inbox-n" hidden></span>
      </button>
  </div>
</header>

<main class="page pf-page">
  <p class="crumb" style="font-size:.85rem;opacity:.7;margin-bottom:6px">
    <a href="/">&lsaquo; Search Circuits.com</a>
  </p>
  <div id="profile-body"><div class="empty"><div class="big"><span class="spin" aria-hidden="true"></span>Loading…</div></div></div>
</main>

<footer class="footer">
  <div class="inner">
    <div class="flinks">
      <a href="/terms">Terms</a>
      <a href="/privacy">Privacy</a>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <span>© 2026 Circuits.com</span>
      <span class="footer-brand"><img class="footer-mark" src="/assets/favicon.png" alt="Circuits.com"></span>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/store.js"></script>
<script src="/app.js"></script>
<script src="/profile.js"></script>
<script>initProfile();</script>
</body>
</html>

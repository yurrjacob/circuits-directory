<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request Access To Your Profile — Circuits.com</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/favicon.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="topbar">
  <div class="inner">
    <div class="brand"><a href="/"><img class="logo-nav" src="/assets/logo-bar.png" alt="Circuits.com"></a><span class="brand-slogan">Connecting The Circuits Industry</span></div>
    <nav class="nav">
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
      <a class="nav-auth" href="/portal">Sign In</a>
      <a class="cta" href="/join">Get Listed</a>
    </nav>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card" id="claim-card">
    <h1>Request access to your profile</h1>
    <p class="sub" id="claim-sub-line">Loading…</p>
    <div id="claim-body"></div>
  </div>
</div>

<footer class="footer">
  <div class="inner">
    <div class="flinks">
      <a href="/terms">Terms</a>
      <a href="/privacy">Privacy</a>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <span>© 2026 Circuits.com</span>
      <span class="footer-brand"><img class="footer-mark" src="/assets/favicon.png" alt="Circuits.com"></span>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/store.js"></script>
<script src="/app.js"></script>
<script>
/* Accounts are only ever created through Get Listed. This page does NOT
   register anyone — it raises a request that Circuits.com staff verify, and
   staff then attach an account to the company in the admin console. */
const handle = (new URLSearchParams(location.search).get('c') || '').toLowerCase();
const body = document.getElementById('claim-body');
const sub  = document.getElementById('claim-sub-line');

function noCompany(){
  sub.textContent = 'Which company is yours?';
  body.innerHTML = '<p class="auth-note">Search the keyword your company is listed under, open its '
    + 'profile from the results, and use the &ldquo;Claim this profile&rdquo; link at the bottom.<br><br>'
    + 'Not listed yet? <a href="/join">Get listed</a> — that is where you create your account '
    + 'and reserve your circuits.com address.</p>';
}

(async () => {
  if(!handle) return noCompany();
  let co;
  try {
    co = await fetchCompanyByHandle(handle);
  } catch(err){
    // a failed lookup is not the same as "no such company" — do not send them away
    console.error('claim lookup failed', err);
    sub.textContent = '';
    body.innerHTML = loadErrorHtml('that company');
    return;
  }
  if(!co){ sub.textContent = 'We could not find that company.'; return noCompany(); }

  sub.innerHTML = 'For <b>' + escapeHtml(co.name) + '</b> &mdash; circuits.com/' + escapeHtml(co.handle);
  body.innerHTML = `
    <form id="cf" autocomplete="off">
      <div class="auth-field"><label>Your name</label><input id="n" type="text" required maxlength="80"></div>
      <div class="auth-field"><label>Your work email</label><input id="e" type="email" required placeholder="you@yourcompany.com"></div>
      <div class="auth-field"><label>Your role</label><input id="r" type="text" maxlength="80" placeholder="Sales Director"></div>
      <div class="auth-field"><label>How can we verify you work there?</label>
        <textarea id="v" rows="4" maxlength="1000" placeholder="Your name on the company website, a work phone number we can call, or the email address already on the listing."></textarea></div>
      <div id="cm" style="font-size:.85rem;margin-bottom:12px;color:#b3261e"></div>
      <button class="submit" type="submit" id="cs">Send request →</button>
    </form>
    <div class="auth-note">A person checks every request. We will not hand over a profile without
    verifying you work there. Once approved we email you your sign-in details.</div>`;

  armSpamTrap(document.getElementById('cf'));
  document.getElementById('cf').addEventListener('submit', async e => {
    e.preventDefault();
    if(looksLikeSpam(e.currentTarget)){
      document.getElementById('claim-card').innerHTML = '<h1>Request sent</h1>'
        + '<p class="sub">We will verify your request and email you back.</p>';
      return;
    }
    const btn = document.getElementById('cs'); btn.disabled = true;
    const name  = document.getElementById('n').value.trim();
    const email = document.getElementById('e').value.trim();
    const role  = document.getElementById('r').value.trim();
    const ev    = document.getElementById('v').value.trim();
    if(!isValidEmail(email)){
      document.getElementById('cm').textContent = 'Please enter a valid email address.';
      btn.disabled = false; return;
    }
    const err = await submitClaim(co.slug, { name, email, role_title: role, evidence: ev });
    if(err){ document.getElementById('cm').textContent = err; btn.disabled = false; return; }
    sendFounderEmail('Profile access request — ' + co.name, {
      company: co.name, circuits_address: 'circuits.com/' + co.handle,
      claimant: name, role: role || '(none)', email, evidence: ev || '(none)'
    }, 'Thanks — we received your request for ' + co.name + ' on Circuits.com. We will verify it and '
     + 'email you back, usually within 1 business day.');
    document.getElementById('claim-card').innerHTML =
      '<h1>Request sent</h1><p class="sub">We will verify you work at ' + escapeHtml(co.name) +
      ' and email you your sign-in details.</p><div class="auth-foot"><a href="/">Back to Circuits.com</a></div>';
  });
})();
</script>
</body>
</html>

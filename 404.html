<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found — Circuits.com</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/assets/favicon.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="topbar">
  <div class="inner">
    <div class="brand"><a href="/"><img class="logo-nav" src="/assets/logo-bar.png" alt="Circuits.com"></a><span class="brand-slogan">Connecting The Circuits Industry</span></div>
    <nav class="nav">
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
      <a class="nav-auth" href="/portal">Sign In</a>
      <a class="cta" href="/join">Get Listed</a>
    </nav>
  </div>
</header>

<!-- circuits.com/<handle> resolves here until the static page is generated.
     If the handle belongs to a real company the profile renders in place;
     otherwise the 404 below stays put, so old dead URLs remain dead. -->
<main class="page pf-page" id="maybe-profile" style="display:none">
  <div id="profile-body"></div>
</main>

<main class="page prose" id="real-404" style="display:none">
  <h1>That page doesn&rsquo;t exist</h1>
  <p class="lede">The link may be out of date. Search for what you need, or browse the directory.</p>
  <form class="mini-search" onsubmit="event.preventDefault();var q=this.q.value.trim();if(q)location.href='/results?q='+encodeURIComponent(q);" style="max-width:420px">
    <input name="q" type="text" placeholder="Search any part, supplier or keyword" aria-label="Search">
    <button type="submit" class="search-go mini" aria-label="Search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
  </form>
  <div class="btn-row">
    <a class="btn btn-primary" href="/directory">Browse Categories</a>
    <a class="btn" href="/join"><b>Get Listed</b></a>
  </div>
</main>

<footer class="footer">
  <div class="inner">
    <div class="flinks">
      <a href="/">Home</a>
      <a href="/login">Staff Login</a>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <span>© 2026 Circuits.com</span>
      <span class="footer-brand"><img class="footer-mark" src="/assets/favicon.png" alt="Circuits.com"></span>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/store.js"></script>
<script src="/app.js"></script>
<script src="/profile.js"></script>
<script>
(async () => {
  const prof = document.getElementById('maybe-profile');
  const dead = document.getElementById('real-404');
  let found = false;
  try { prof.style.display = ''; found = await initProfile(); } catch(e){ found = false; }
  if(!found){ prof.style.display = 'none'; dead.style.display = ''; }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search Results - Circuits.com</title>
<!-- No robots meta here on purpose: a static noindex stops Google from ever
     rendering the page. app.js decides per keyword — index when real listings
     exist, noindex for empty pages, outages and the sample fixture. -->
<meta name="description" content="Suppliers listed under this Circuits-Keyword™ on Circuits.com, the circuits industry directory. Contact them directly or request a quote.">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="styles.css">
<script src="/nav.js"></script>
<script async src="/analytics.js"></script>
</head>
<body>

<header class="topbar">
  <div class="inner">
    <div class="brand"><a href="/"><img class="logo-nav" src="assets/logo-bar.png" alt="Circuits.com"></a><span class="brand-slogan">Connecting The Circuits Industry</span></div>
    <nav class="nav">
      <a href="/">Home</a>
      <a href="/browse">Browse</a>
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
      <a class="nav-auth" href="/portal">Sign In</a>
      <a class="cta" href="/join">Get Listed</a>
    </nav>
  </div>
</header>

<div class="subbar">
  <div class="inner subbar-inner">
    <form id="mini-form" class="mini-search" autocomplete="off">
      <input id="mini-search" type="text" placeholder="Search a keyword" aria-label="Search">
      <button type="submit" class="search-go mini" aria-label="Search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
    </form>
    <div class="subbar-meta">
      <span class="kw-line">Circuits-Keyword™: <b data-term>…</b></span>
      <span class="count-line">Showing <b id="result-count">0</b> results for <b data-term>…</b></span>
    </div>
  </div>
</div>

<div id="results-body"></div>

<footer class="footer">
  <div class="inner">
    <div class="flinks">
      <a href="/terms">Terms</a>
      <a href="/privacy">Privacy</a>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <span>© 2026 Circuits.com</span>
      <span class="footer-brand"><img class="footer-mark" src="assets/favicon.png" alt="Circuits.com"></span>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="store.js"></script>
<script src="app.js"></script>
<script>initResults();</script>
</body>
</html>

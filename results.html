<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search Results | Circuits.com</title>
<!-- No robots meta here on purpose: a static noindex stops Google from ever
     rendering the page. app.js decides per keyword, index when real listings
     exist, noindex for empty pages, outages and the sample fixture.
     Canonical is likewise set per keyword by app.js (setResultsMeta), so none
     is hard-coded here. -->
<meta name="description" content="Suppliers listed under this Circuits-Keyword™ on Circuits.com, the circuits industry directory. Contact them directly by phone or email.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Circuits.com">
<meta property="og:title" content="Search Circuits.com">
<meta property="og:description" content="Find suppliers listed under a Circuits-Keyword™ on Circuits.com, the circuits industry directory.">
<meta property="og:image" content="https://circuits.com/assets/og-card.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Search Circuits.com">
<meta name="twitter:description" content="Find suppliers listed under a Circuits-Keyword™ on Circuits.com, the circuits industry directory.">
<meta name="twitter:image" content="https://circuits.com/assets/og-card.png">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="styles.css">
<script src="/nav.js"></script>
<script async src="/analytics.js"></script>
</head>
<body>

<header class="topbar">
  <div class="inner">
    <div class="brand"><a href="/"><img class="logo-nav" src="assets/logo-bar.png" alt="Circuits.com"></a><span class="brand-slogan">Connecting The Circuits Industry</span></div>
    <nav class="nav">
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
      <a class="nav-auth nav-signin" href="/portal">Sign In</a>
      <a class="nav-auth nav-dash" href="/portal">Dashboard</a>
      <a class="cta" href="/join">Get Listed</a>
    </nav>
      <!-- The bell ships in the markup and starts hidden; nav.js shows it in
           <head> when somebody is signed in, and app.js only fills it in. It
           used to be built and inserted at DOMContentLoaded, after an async
           currentUser() call, so it landed well after first paint and shoved
           the whole header sideways on every load (Jacob, 2026-09-03). -->
      <button type="button" class="inbox-btn" aria-label="Notifications" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="inbox-n" hidden></span>
      </button>
  </div>
</header>

<div class="subbar">
  <div class="inner subbar-inner">
    <form id="mini-form" class="mini-search" autocomplete="off">
      <input id="mini-search" type="text" placeholder="Search a keyword" aria-label="Search">
      <button type="submit" class="search-go mini" aria-label="Search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
    </form>
    <div class="subbar-meta">
      <span class="kw-line">Circuits-Keyword™: <b data-term>…</b></span>
      <span class="count-line">Showing <b id="result-count">0</b> Results for <b data-term>…</b></span>
    </div>
  </div>
</div>

<div id="saved-strip" class="saved-strip" hidden></div>

<div id="results-body"></div>

<footer class="footer">
  <div class="inner">
    <div class="flinks">
      <a href="/terms">Terms</a>
      <a href="/privacy">Privacy</a>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <span>© 2026 Circuits.com</span>
      <span class="footer-brand"><img class="footer-mark" src="assets/favicon.png" alt="Circuits.com"></span>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="store.js"></script>
<script src="app.js"></script>
<script>initResults();</script>
</body>
</html>

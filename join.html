<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Listed | Circuits.com</title>
<meta name="description" content="List your company on Circuits.com and get discovered by buyers, engineers and partners across the circuits and electronics industry.">
<link rel="canonical" href="https://circuits.com/register">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="assets/favicon.png">
<!-- Listings need an account (Jacob, 2026-09-03: "users need an account to
     create listings on any part of the site"). The old anonymous form is in
     backups/join-2026-09-03/. Signed in, nav.js already sends /join to the
     Listings tab; signed out, this page goes straight to registration. -->
<script>
(function(){
  var on = false;
  try{ for(var i = 0; i < localStorage.length; i++){ if(/^sb-.*-auth-token$/.test(localStorage.key(i) || '')) on = true; } }catch(e){}
  location.replace(on ? '/portal#listings' : '/register');
})();
</script>
</head>
<body>
<p style="font-family:system-ui,sans-serif;margin:40px;text-align:center">Listings are created from your profile.
<a href="/register">Create your profile</a> or <a href="/portal#listings">sign in</a>.</p>
</body>
</html>

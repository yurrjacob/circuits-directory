# Generates the static profile pages and the sitemap from the live directory
# (tools/build-profiles.js reads with the public key), so circuits.com/<name>
# is a real file with a 200 status and a canonical, not the 404 fallback.
# Runs nightly and on demand; commits only when something changed.
name: build profiles
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-profiles.js
      - run: node tools/stamp.js
      - run: node tools/check.js
      - name: commit generated pages
        run: |
          git config user.name "circuits-bot"
          git config user.email "notifications@circuits.com"
          git add -A
          git diff --cached --quiet || git commit -m "Generated profile pages and sitemap"
          git push
